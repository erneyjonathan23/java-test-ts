# CI: runs on every pull request (and on main). Every job is a required status check (branch protection).
# Gates and why:
#   build-test   - the code compiles and the behaviours that protect money and customers are proven (signatures,
#                  idempotency, no PII in logs). Coverage is not a gate: test quality is reviewed, not counted.
#   contracts    - the OpenAPI and the event schema are valid and do not break consumers (lint + schema tests).
#   iac          - Bicep lints with zero warnings and passes PSRule (Well-Architected security/reliability rules).
#   security     - CodeQL (code), dependency review (known-vulnerable or disallowed licences), secret scan
#                  (a leaked provider/Salesforce secret is a production incident), image scan (CRITICAL/HIGH fail).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: practical
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: practical/target/surefire-reports
      - name: Keep the tested jar for the image job
        uses: actions/upload-artifact@v4
        with:
          name: intake-jar
          path: practical/target/payments-intake-*.jar
          retention-days: 7

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint OpenAPI contract
        run: npx --yes @stoplight/spectral-cli@6.11.1 lint docs/api/webhooks.openapi.yaml --ruleset .github/spectral.yaml --fail-severity error
      - name: Event schema is valid JSON Schema 2020-12
        run: npx --yes -p ajv-cli@5.0.0 -p ajv-formats@3.0.1 ajv compile --spec=draft2020 -c ajv-formats -s docs/api/events/premium-payment.schema.json
      - name: No breaking change in the event schema (required fields only grow by major version)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git show "origin/${{ github.base_ref }}:docs/api/events/premium-payment.schema.json" > /tmp/base.json || exit 0
          python3 - <<'PY'
          import json, sys
          base = json.load(open('/tmp/base.json'))
          head = json.load(open('docs/api/events/premium-payment.schema.json'))
          def req(s): return set(s['$defs']['PaymentData']['required'])
          def props(s): return set(s['$defs']['PaymentData']['properties'])
          same_major = base['$id'].split('/')[-2].split('.')[0] == head['$id'].split('/')[-2].split('.')[0]
          if same_major and (req(head) - req(base) or props(base) - props(head)):
              sys.exit('Breaking change in premium-payment schema without a new major version')
          PY

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bicep build and lint (warnings fail the build)
        run: |
          az bicep install
          az bicep lint --file infra/main.bicep --diagnostics-format sarif > bicep.sarif
          test "$(jq '[.runs[].results[]] | length' bicep.sarif)" -eq 0
          for env in dev test prod; do az bicep build-params --file infra/env/$env.bicepparam --stdout > /dev/null; done
      - name: PSRule for Azure (Well-Architected rules)
        uses: microsoft/ps-rule@v2.9.0
        with:
          modules: PSRule.Rules.Azure
          inputPath: infra/
          option: .github/ps-rule.yaml

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the secret scan
      - name: Secret scan (whole history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # reference/ contains the providers' published SANDBOX secrets on purpose; see .gitleaks.toml
          GITLEAKS_CONFIG: .github/gitleaks.toml
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - run: ./mvnw -B -DskipTests compile
        working-directory: practical
      - uses: github/codeql-action/analyze@v3

  image:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: intake-jar
          path: practical/target
      - name: Build image (not pushed from CI)
        run: docker build -t payments-intake:${{ github.sha }} practical
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: payments-intake:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
