spring:
  application:
    name: payments-intake
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true
  threads:
    # Java 21 virtual threads for request handling: blocking I/O (SQL, Service Bus) without thread-pool sizing.
    virtual:
      enabled: true

server:
  port: 8080
  # Fail fast: the slowest provider timeout is 5 s (Andina).
  tomcat:
    connection-timeout: 4s

intake:
  max-body-bytes: 65536
  # Hard limit for publishing an event; must stay below the strictest provider timeout (Andina 5 s).
  publish-timeout: 3s
  # Lease on an event while one delivery publishes it; longer than publish-timeout.
  claim-lease: 10s
  # Secrets are NEVER written here. Locally they come from environment variables
  # (INTAKE_SECRETS_QUETZAL_WEBHOOK, INTAKE_SECRETS_ANDINA_WEBHOOK, comma-separated: current,next);
  # in Azure from Key Vault through the managed identity.

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  # JSON logs (Elastic Common Schema) for Log Analytics; MDC fields such as correlationId are included
  # automatically. Payloads are never logged.
  structured:
    format:
      console: ecs
